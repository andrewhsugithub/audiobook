name: HLS Job

on:
  repository_dispatch:
    types: [trigger-hls]

concurrency:
  group: "hls-${{ github.event.client_payload.audiobookId }}"
  cancel-in-progress: false

jobs:
  hls:
    name: "HLS Generation for Book: ${{ github.event.client_payload.audiobookId }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Install FFmpeg for act medium image
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify System FFmpeg Installation
        run: |
          ffmpeg -version
          ffmpeg -codecs 2>/dev/null | grep aac
          echo "✅ FFmpeg system layer validated"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile --filter @audiobook/hls...

      - name: Build HLS Component
        run: pnpm --filter @audiobook/hls build

      - name: Execute HLS Engine
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          JOB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node apps/hls/dist/index.mjs

      - name: Upload Processing Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "ffmpeg-error-logs-${{ github.event.client_payload.audiobookId }}-${{ github.run_id }}"
          path: /tmp/hls_*/
          retention-days: 1
